  <body>
    <script type="text/javascript">
      // GitHub Pages SPA redirect: restaura o caminho original codificado pelo 404.html
      // antes do React Router assumir o roteamento (https://github.com/rafgraph/spa-github-pages)
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
