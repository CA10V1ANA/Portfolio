<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Caio de Oliveira Viana | Full Stack Developer</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect (https://github.com/rafgraph/spa-github-pages)
      // Reescreve a URL de uma rota profunda para a raiz com o caminho codificado
      // na query string, para que o React Router possa restaurá-la após o carregamento.
      var segmentCount = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + segmentCount)
            .join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
